tokenizer_path: checkpoints/safe_gpt_base

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  fp_bits: 4096
  fp_encoder_layers: 2
  cross_attn_every_n: 2
  max_seq_len: 256
  dropout: 0.1

data:
  preprocessed_dir: "data/pretrain_100m"
  format: arrow
  formula_grouped: true
  mix_formula_remainders: false
  validation_split: null

training:
  safe_gpt_path: "checkpoints/safe_gpt_base"
  warm_start_safe_gpt: true
  seed: 42
  tf32: false
  batch_size: 64
  gradient_accumulation_steps: 2
  max_epochs: 2
  max_steps: null
  lr: 3e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 2000
  max_grad_norm: 1.0
  num_workers: 0
  log_interval: 100
  save_interval: 20000
  eval_interval: 0
  output_dir: "checkpoints/pretraining/ms_gpt_mlm"
  output_name: "ms_gpt_mlm.pt"
  wandb_project: null
  run_name: null
