tokenizer_path: checkpoints/safe_gpt_base_msg_50m

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  fp_bits: 4096
  fp_encoder_layers: 2
  cross_attn_every_n: 2
  max_seq_len: 256
  dropout: 0.1

data:
  preprocessed_dir: "data/msg_pretrain_50m"
  format: tokenized_parquet
  formula_grouped: true
  mix_formula_remainders: true
  validation_split: val

training:
  safe_gpt_path: "checkpoints/safe_gpt_base_msg_50m"
  warm_start_safe_gpt: true
  seed: 42
  tf32: true
  batch_size: 64
  gradient_accumulation_steps: 2
  max_epochs: 2
  max_steps: null
  lr: 3e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 2000
  max_grad_norm: 1.0
  num_workers: 2
  log_interval: 100
  save_interval: 5000
  eval_interval: 5000
  output_dir: "checkpoints/pretraining/ms_gpt_mlm_msg_50m"
  output_name: "ms_gpt_mlm_msg_50m.pt"
  wandb_project: null
  run_name: null
